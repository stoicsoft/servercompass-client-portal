name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/client-portal-runtime/package-lock.json
      - run: npm ci --prefix packages/client-portal-runtime
      - run: npm test
      - name: Build broker smoke image
        run: docker build --file packages/client-portal-runtime/broker/Dockerfile --tag servercompass-client-portal-broker:smoke packages
      - name: Smoke-check broker startup
        run: bash scripts/smoke-broker-image.sh servercompass-client-portal-broker:smoke
